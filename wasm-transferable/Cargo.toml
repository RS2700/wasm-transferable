[package]
name = "wasm-transferable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Serialize Rust structs into JsValue while collecting Transferable Objects"
repository.workspace = true
license.workspace = true
keywords = ["wasm", "transferable", "web-worker", "messaging", "serde"]
categories = ["encoding", "wasm", "web-programming"]

[dependencies]
array-init = "2.1.0"
js-sys = { version = "0.3.106", default-features = false, features = ["std"] }
thiserror = "2.0.21"
wasm-bindgen.workspace = true
wasm-transferable-macro = { path = "../wasm-transferable-macro", optional = true }
web-sys = { version = "0.3.106", optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
derive = ["dep:wasm-transferable-macro"]

std-ext = []
wasm-bindgen-ext = []

MessagePort-post-ext = ["dep:web-sys", "web-sys/MessagePort"]
Window-post-ext = ["dep:web-sys", "web-sys/Window"]
Worker-post-ext = ["dep:web-sys", "web-sys/Worker"]

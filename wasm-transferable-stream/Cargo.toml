[package]
name = "wasm-transferable-stream"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
description = "A Stream API-like ecosystem for wasm-transferable"
repository.workspace = true
license.workspace = true
keywords = ["wasm", "transferable", "web-worker", "stream", "channel"]
categories = ["encoding", "wasm", "web-programming", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
default-target = "wasm32-unknown-unknown"
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
futures = { version = "0.3.34", default-features = false, features = ["alloc", "std"] }
js-sys = { version = "0.3.106", default-features = false, features = ["std"] }
thiserror = "2.0.21"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
wasm-transferable = { version = "=0.1.2", path = "../wasm-transferable", features = ["MessagePort-post-ext", "derive", "std-ext", "wasm-bindgen-ext"] }
web-sys = { version = "0.3.106", features = ["MessageChannel", "MessageEvent", "MessagePort"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.79"

[package]
name = "wasm-transferable-stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
futures = { version = "0.3.34", default-features = false, features = ["alloc", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4.79"
wasm-transferable = { workspace = true, features = ["derive", "std-ext"] }
web-sys = { version = "0.3.106", features = ["MessageChannel", "MessageEvent", "MessagePort"] }

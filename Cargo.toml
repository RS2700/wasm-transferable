[workspace]
resolver = "3"
members = [
    "wasm-transferable",
    "wasm-transferable-macro",
    "wasm-transferable-stream",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
repository = "https://github.com/RS2700/wasm-transferable"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wasm-transferable = { path = "wasm-transferable" }
